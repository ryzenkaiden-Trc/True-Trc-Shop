<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>TRC Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#060606;--panel:#101010;--line:#262626;--text:#f2f2f2;--mute:#9a9a9a;--accent:#dfe3e8;--glow:rgba(225,229,235,.13);--grid:rgba(255,255,255,.04);--c1:#fff;--c2:#8c9198;--c3:#eef0f3;--c4:#5a5f66;--glass:rgba(255,255,255,.07);--glass-bd:rgba(255,255,255,.2);--glass-hi:rgba(255,255,255,.38);--solid-bg:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,.12));--solid-ink:#fff;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f1f1f1;--panel:#fff;--line:#cfcfcf;--text:#0a0a0a;--mute:#585858;--accent:#2a2a2a;--glow:rgba(0,0,0,.08);--grid:rgba(0,0,0,.05);--c1:#0a0a0a;--c2:#6b7078;--c3:#2b2e33;--c4:#a2a7ae;--glass:rgba(255,255,255,.6);--glass-bd:rgba(0,0,0,.16);--glass-hi:rgba(255,255,255,.95);--solid-bg:linear-gradient(180deg,rgba(10,10,10,.9),rgba(10,10,10,.74));--solid-ink:#fff;color-scheme:light}}
:root[data-theme="light"]{--bg:#f1f1f1;--panel:#fff;--line:#cfcfcf;--text:#0a0a0a;--mute:#585858;--accent:#2a2a2a;--glow:rgba(0,0,0,.08);--grid:rgba(0,0,0,.05);--c1:#0a0a0a;--c2:#6b7078;--c3:#2b2e33;--c4:#a2a7ae;--glass:rgba(255,255,255,.6);--glass-bd:rgba(0,0,0,.16);--glass-hi:rgba(255,255,255,.95);--solid-bg:linear-gradient(180deg,rgba(10,10,10,.9),rgba(10,10,10,.74));--solid-ink:#fff;color-scheme:light}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}
.wrap{max-width:1240px;margin:0 auto;padding:0 28px}
.chrome{background:linear-gradient(180deg,var(--c1) 0%,var(--c2) 46%,var(--c3) 54%,var(--c4) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 70%,transparent);-webkit-backdrop-filter:blur(16px) saturate(160%);backdrop-filter:blur(16px) saturate(160%);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
#bar{position:absolute;left:0;bottom:-1px;display:block;height:2px;width:100%;background:linear-gradient(90deg,var(--c4),var(--c1));transform:scaleX(var(--p,0));transform-origin:left}
.logo{display:flex;align-items:center;gap:11px;font-stretch:125%;font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:15px}
.logo i{font-style:normal;font-weight:400;color:var(--mute)}
.mark{width:30px;height:30px;flex:none;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.logo:hover .mark{transform:rotate(60deg)}
nav{display:flex;gap:32px;align-items:center;font-size:15px;color:var(--mute)}
nav a:hover{color:var(--text)}
.btn{position:relative;overflow:hidden;isolation:isolate;display:inline-flex;align-items:center;justify-content:center;gap:10px;text-align:center;padding:13px 26px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-bd);color:var(--text);font-weight:600;font-size:15px;-webkit-backdrop-filter:blur(14px) saturate(170%);backdrop-filter:blur(14px) saturate(170%);box-shadow:inset 0 1px 0 var(--glass-hi),inset 0 -1px 0 rgba(0,0,0,.12),0 10px 30px -12px rgba(0,0,0,.6);transition:transform .4s cubic-bezier(.2,.7,.2,1),box-shadow .4s,background .4s,border-color .4s}
.btn::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.4) 50%,transparent 65%);transform:translateX(-130%);transition:transform .9s cubic-bezier(.2,.7,.2,1)}
.btn:hover::after{transform:translateX(130%)}
.btn:hover{transform:translateY(-2px);border-color:var(--glass-hi);box-shadow:inset 0 1px 0 var(--glass-hi),0 16px 36px -12px rgba(0,0,0,.65),0 0 0 4px var(--glow)}
.btn:active{transform:scale(.97)}
.btn.solid,.btn.solid:hover{background:var(--solid-bg);color:var(--solid-ink)}
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line);background:radial-gradient(60% 70% at 78% 30%,var(--glow),transparent 70%),linear-gradient(var(--grid) 1px,transparent 1px) 0 0/72px 72px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/72px 72px}
.hero .wrap{position:relative;z-index:1;display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center;min-height:min(760px,calc(100vh - 64px));padding-top:72px;padding-bottom:72px}
.orb{position:absolute;border-radius:50%;filter:blur(70px);background:var(--accent);opacity:.2;pointer-events:none;animation:drift 20s ease-in-out infinite alternate}
.o1{width:420px;height:420px;right:6%;top:8%}
.o2{width:260px;height:260px;left:6%;bottom:6%;opacity:.14;animation-duration:26s;animation-direction:alternate-reverse}
@keyframes drift{to{transform:translate3d(-60px,50px,0) scale(1.15)}}
h1{font-stretch:125%;font-weight:700;text-transform:uppercase;font-size:clamp(2.3rem,5.2vw,4.5rem);line-height:1.04;letter-spacing:-.01em;margin:0 0 28px}
.lede{color:var(--mute);font-size:19px;max-width:28em;margin:0 0 40px}
.actions{display:flex;gap:14px;flex-wrap:wrap}
.hin{animation:hin 1s cubic-bezier(.2,.7,.2,1) backwards;animation-delay:var(--hd,0s)}
@keyframes hin{from{opacity:0;transform:translateY(30px);filter:blur(8px)}}
.code{background:#0b0b0b;border:1px solid #2c2c2c;border-radius:18px;overflow:hidden;color:#e4e4e4;font-size:15px;line-height:2;min-width:0;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.code .bar{display:flex;justify-content:space-between;padding:12px 20px;border-bottom:1px solid #2c2c2c;color:#808080;font-size:12.5px}
.code pre{margin:0;padding:22px 20px}
.ln{display:block;opacity:0;animation:ln .45s ease forwards;animation-delay:calc(var(--i)*.16s + .6s)}
@keyframes ln{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
.code .foot{border-top:1px solid #2c2c2c;padding:12px 20px;font-size:12.5px;color:#808080;display:flex;gap:18px;flex-wrap:wrap}
.code b{color:#fff;font-weight:500}
section{position:relative;padding:104px 0;border-top:1px solid var(--line)}
h2{font-stretch:125%;font-weight:600;font-size:clamp(1.8rem,3.6vw,3rem);line-height:1.12;margin:0 0 20px;max-width:16em}
.sub{color:var(--mute);max-width:34em;margin:0 0 48px}
#plans{background:radial-gradient(28% 36% at 16% 62%,rgba(47,224,138,.13),transparent),radial-gradient(28% 36% at 50% 62%,rgba(255,150,40,.13),transparent),radial-gradient(28% 36% at 84% 62%,rgba(255,64,64,.13),transparent)}
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.plan{display:flex}
.card{flex:1;display:flex;flex-direction:column;overflow:hidden;border-radius:24px;border:1px solid color-mix(in srgb,var(--tint) 50%,transparent);background:linear-gradient(165deg,color-mix(in srgb,var(--tint) 22%,transparent),var(--glass) 60%);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 24px 60px -30px var(--tint);transition:transform .5s cubic-bezier(.2,.7,.2,1),box-shadow .5s}
.card:hover{transform:translateY(-6px);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 36px 70px -26px var(--tint)}
.ban{position:relative;aspect-ratio:16/10;overflow:hidden;border-bottom:1px solid color-mix(in srgb,var(--tint) 40%,transparent)}
.ban img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .9s cubic-bezier(.2,.7,.2,1)}
.card:hover .ban img{transform:scale(1.06)}
.soon{position:absolute;top:14px;right:14px;padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;color:#fff;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.3);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.pb{flex:1;display:flex;flex-direction:column;gap:14px;padding:28px 28px 30px}
.pb h3{margin:0;display:flex;align-items:center;gap:10px;font-stretch:118%;font-size:20px;font-weight:600}
.pb h3::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--tint);box-shadow:0 0 14px var(--tint)}
.amt{font-stretch:125%;font-size:40px;font-weight:600;line-height:1.1}
.amt small{font-stretch:100%;font-size:15px;font-weight:400;color:var(--mute);-webkit-text-fill-color:var(--mute)}
.pb ul{margin:4px 0 18px;padding:0;list-style:none;flex:1;font-size:15.5px}
.pb li{padding:9px 0;border-top:1px solid color-mix(in srgb,var(--tint) 28%,transparent)}
.pay{display:grid;gap:10px}
.ic{flex:none;display:inline-block;width:26px;height:26px;border-radius:30%;background:#000 center/cover no-repeat;box-shadow:0 0 0 1px rgba(255,255,255,.3)}

<body>
<header><div class="wrap">
 <span class="logo"><svg class="mark" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="miter" aria-hidden="true"><path d="M27.3 9.5 16 3 4.7 9.5v13L16 29l11.3-6.5"/><path d="M10.5 12h11M16 12v9.5"/></svg><span>TRC <i>Admin</i></span></span>
 <nav><button class="btn" id="out" type="button" hidden>Lock</button></nav>
</div></header>

<main class="wrap adm">
 <div class="pn" id="lock">
  <h2 class="chrome">Admin</h2>
  <div class="fld"><input id="tk" type="password" class="mono" placeholder="Admin token" autocomplete="off"><button class="btn solid" id="go" type="button">Unlock</button></div>

  <p class="sv mono" id="sv"></p>
 </div>

 <div id="app" hidden>
  <div class="pn gen" id="gp" style="--tint:#2fe08a">
   <h3>Generate keys</h3>
   <div class="seg" role="group" aria-label="Plan"><button type="button" data-p="std" aria-pressed="true">Standard</button><button type="button" data-p="pre" aria-pressed="false">Premium</button></div>
   <div class="fld stp">
    <button class="btn alt sq" id="mn" type="button" aria-label="Less">−</button>
    <input id="ct" type="number" min="1" max="100" value="1" aria-label="Amount">
    <button class="btn alt sq" id="pp" type="button" aria-label="More">+</button>
    <button class="btn solid" id="gen" type="button">Generate</button>
   </div>
   <p class="msg" id="gm"></p>
   <div id="ko"></div>
   <div class="fld" style="margin-top:14px"><button class="btn alt" id="ca" type="button" hidden>Copy all</button></div>
  </div>

  <div class="pn">
   <h3>Keys</h3>
   <div class="chips"><button class="chip" data-f="all" aria-pressed="true" type="button">All</button><button class="chip" data-f="unused" aria-pressed="false" type="button">Unused</button><button class="chip" data-f="used" aria-pressed="false" type="button">Used</button></div>
   <div id="kl"></div>
  </div>
 </div>
</main>

<script src="config.js"></script>
<script>
var T="",f="all",P="std",fl=0,rows=[],CS="abcdefghijklmnopqrstuvwxyz0123456789#!@?*";
function $(i){return document.getElementById(i)}
async function api(b){var u=window.TRC_API;if(!u||u.indexOf("PASTE")>-1)throw{error:"config"};b.t=T;var r;try{r=await fetch(u,{method:"POST",body:JSON.stringify(b)})}catch(e){throw{error:"net"}}var d;try{d=await r.json()}catch(e){throw{error:"access"}}if(d.error)throw d;return d}
function msg(x){var m={unauthorized:"Wrong token",config:"config.js has no URL",net:"Cannot reach server",access:"Set access to Anyone, then redeploy",bad:"Server error"};return m[x&&x.error]||"Try again"}
function rnd(n){var o="",lim=256-256%CS.length;while(o.length<n){var a=crypto.getRandomValues(new Uint8Array(64));for(var i=0;i<a.length&&o.length<n;i++)if(a[i]<lim)o+=CS[a[i]%CS.length]}return o}
async function sha(s){var h=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return Array.from(new Uint8Array(h)).map(function(b){return b.toString(16).padStart(2,"0")}).join("")}
function cp(t,b){var o=b.textContent;function ok(){b.textContent="Copied";setTimeout(function(){b.textContent=o},1500)}function fb(){var a=document.createElement("textarea");a.value=t;a.style.cssText="position:fixed;opacity:0";document.body.appendChild(a);a.select();try{document.execCommand("copy");ok()}catch(e){}a.remove()}if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(ok,fb)}else fb()}
function show(keys){var o=$("ko");o.textContent="";keys.forEach(function(k,i){var d=document.createElement("div");d.className="kc";d.style.setProperty("--i",Math.min(i,14));var c=document.createElement("code");c.className="mono";c.textContent=k;var b=document.createElement("button");b.className="btn alt";b.type="button";b.textContent="Copy";b.onclick=function(){cp(k,b)};d.appendChild(c);d.appendChild(b);o.appendChild(d)});$("ca").hidden=false;$("ca").onclick=function(){cp(keys.join("\n"),$("ca"))}}
async function load(){var d=await api({a:"list"});rows=d.keys;draw()}
function draw(){$("kl").innerHTML=rows.filter(function(k){return f==="all"||(f==="used")===!!k.used}).map(function(k,i){return '<div class="kr" style="animation-delay:'+Math.min(i,12)*.04+'s"><b>'+(k.plan==="std"?"Standard":"Premium")+'</b><span class="mono">'+k.hash.slice(0,8)+'</span><span class="st '+(k.used?"us":"un")+'">'+(k.used?"Used · "+new Date(k.used_at).toLocaleString():"Unused")+'</span><span class="ac">'+(k.used?'<button class="btn alt" type="button" data-a="reset" data-id="'+k.hash+'">Reset</button>':"")+'<button class="btn alt" type="button" data-a="delete" data-id="'+k.hash+'">Delete</button></span></div>'}).join("")}
async function unlock(){if($("go").disabled)return;T=$("tk").value.trim();$("lm").textContent="";$("go").disabled=true;try{await load();$("lock").classList.add("gone");setTimeout(function(){$("lock").hidden=true;$("app").hidden=false;$("out").hidden=false},320);return}catch(x){T="";fl++;$("tk").classList.remove("shake");void $("tk").offsetWidth;$("tk").classList.add("shake");$("lm").textContent=msg(x);if(fl>=5){$("lm").textContent="Wait 30s";setTimeout(function(){$("go").disabled=false;fl=0;$("lm").textContent=""},30000);return}}$("go").disabled=false}
$("go").onclick=unlock;
$("tk").onkeydown=function(e){if(e.key==="Enter")unlock()};
$("out").onclick=function(){T="";location.reload()};
document.querySelectorAll("[data-p]").forEach(function(c){c.onclick=function(){P=c.dataset.p;$("gp").style.setProperty("--tint",P==="std"?"#2fe08a":"#ff9a2e");document.querySelectorAll("[data-p]").forEach(function(o){o.setAttribute("aria-pressed",o===c)})}});
function step(d){$("ct").value=Math.min(Math.max((+$("ct").value||1)+d,1),100)}
$("mn").onclick=function(){step(-1)};$("pp").onclick=function(){step(1)};
$("gen").onclick=async function(){var b=$("gen");b.disabled=true;$("gm").textContent="";try{var n=Math.min(Math.max(+$("ct").value||1,1),100),keys=[],hs=[];for(var i=0;i<n;i++){var k="TRC_"+rnd(30);keys.push(k);hs.push(await sha(k))}await api({a:"add",plan:P,hashes:hs});show(keys);await load()}catch(x){$("gm").textContent=msg(x)}b.disabled=false};
document.querySelectorAll("[data-f]").forEach(function(c){c.onclick=function(){f=c.dataset.f;document.querySelectorAll("[data-f]").forEach(function(o){o.setAttribute("aria-pressed",o===c)});draw()}});
$("kl").onclick=async function(e){var b=e.target.closest("button");if(!b)return;if(b.dataset.a==="delete"&&b.textContent!=="Sure?"){b.textContent="Sure?";setTimeout(function(){b.textContent="Delete"},3000);return}b.disabled=true;try{await api({a:b.dataset.a==="delete"?"del":"reset",id:b.dataset.id});await load()}catch(x){b.disabled=false}};
(async function(){var u=window.TRC_API,s=$("sv");if(!u||u.indexOf("PASTE")>-1){s.className="sv mono bad";s.textContent="config.js has no URL";return}try{var d=await(await fetch(u)).json();if(!d.ok)throw 0;s.className="sv mono ok";s.textContent="Server online"}catch(e){s.className="sv mono bad";s.textContent="Cannot reach server"}})();
</script>
